<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="60" r="45" fill="#0066cc" stroke="#004499" stroke-width="2"/>
  
  <!-- Medical cross -->
  <rect x="42" y="35" width="16" height="50" fill="white" rx="2"/>
  <rect x="27" y="50" width="46" height="20" fill="white" rx="2"/>
  
  <!-- Pill/capsule icon -->
  <ellipse cx="80" cy="35" rx="8" ry="15" fill="#ff6b6b" transform="rotate(20 80 35)"/>
  <ellipse cx="80" cy="35" rx="4" ry="15" fill="#ff9999" transform="rotate(20 80 35)"/>
  
  <!-- Company name -->
  <text x="120" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0066cc">
    Viet Mart
  </text>
  
  <!-- Tagline -->
  <text x="120" y="70" font-family="Arial, sans-serif" font-size="14" fill="#666">
    Nhà Thuốc Uy Tín
  </text>
  
  <!-- Decorative elements -->
  <circle cx="280" cy="25" r="3" fill="#ff6b6b" opacity="0.7"/>
  <circle cx="290" cy="35" r="2" fill="#0066cc" opacity="0.5"/>
  <circle cx="270" cy="40" r="2.5" fill="#00cc66" opacity="0.6"/>
  
  <!-- Subtle border -->
  <rect x="2" y="2" width="296" height="116" fill="none" stroke="#e0e0e0" stroke-width="1" rx="8"/>
</svg>